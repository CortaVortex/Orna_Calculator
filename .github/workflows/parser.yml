name: Weekly Orna Parser

on:
  schedule:
    # Каждый понедельник в 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # ручной запуск из вкладки Actions

jobs:
  parse:
    runs-on: ubuntu-latest

    permissions:
      contents: write # чтобы закоммитить обновлённые JSON

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run parse-codex (items + followers)
        run: node scripts/parse-codex.js

      - name: Run parse-classes
        run: node scripts/parse-classes.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: auto-update parsed data [skip ci]" || echo "No changes to commit"
          git push