<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orna Calculator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1>Orna Calculator</h1>
    <div class="header-row">
      <p class="subtitle" data-ru="Обзор" data-en="View Distance">Обзор</p>
      <button id="lang-toggle" class="lang-btn" title="Switch language / Сменить язык">EN</button>
    </div>
  </header>

  <main class="app-main">

    <!-- ============ РЕЗУЛЬТАТ (две строки) ============ -->
    <section class="panel panel-result">
      <div class="result-line result-line-base">
        <span class="result-line-label" data-ru="Базовый обзор" data-en="Base View">Базовый обзор</span>
        <span class="result-line-value" id="base-view">180 м</span>
      </div>
      <div class="result-line result-line-actual">
        <span class="result-line-label" data-ru="Фактический обзор" data-en="Actual View">Фактический обзор</span>
        <span class="result-line-value" id="actual-view">180 м</span>
      </div>
    </section>

    <!-- ============ КЛАСС, СПЕЦИАЛИЗАЦИЯ, ПИТОМЕЦ ============ -->
    <section class="panel">
      <h2 class="panel-title" data-ru="Класс и питомец" data-en="Class & Follower">Класс и питомец</h2>

      <div class="class-pet-layout">

        <!-- ЛЕВАЯ ЧАСТЬ: класс + специализация -->
        <div class="class-stack">

          <!-- Класс -->
          <div class="class-block">
            <span class="class-caption" data-ru="Класс" data-en="Class">Класс</span>
            <div class="class-row">
              <div class="class-icon-wrap">
                <img class="class-icon" id="class-icon" alt="" hidden>
                <span class="class-icon-placeholder">?</span>
              </div>
              <select class="class-select" id="class-select">
                <option value="" data-ru="— выбери —" data-en="— select —">— выбери —</option>
                <option value="warrior" data-ru="Воин" data-en="Warrior">Воин</option>
                <option value="knight" data-ru="Рыцарь" data-en="Knight">Рыцарь</option>
                <option value="berserker" data-ru="Берсерк" data-en="Berserker">Берсерк</option>
              </select>
              <span class="class-bonus" id="class-bonus">—</span>
            </div>
          </div>

          <!-- Специализация -->
          <div class="class-block">
            <span class="class-caption" data-ru="Специализация" data-en="Specialization">Специализация</span>
            <div class="class-row">
              <div class="class-icon-wrap">
                <img class="class-icon" id="spec-icon" alt="" hidden>
                <span class="class-icon-placeholder">?</span>
              </div>
              <select class="class-select" id="spec-select">
                <option value="" data-ru="— выбери —" data-en="— select —">— выбери —</option>
                <option value="blade" data-ru="Клинок изящества" data-en="Blade of Finesse">Клинок изящества</option>
                <option value="raider" data-ru="Рейдер" data-en="Raider">Рейдер</option>
                <option value="oracle" data-ru="Оракул" data-en="Oracle">Оракул</option>
              </select>
              <span class="class-bonus" id="spec-bonus">—</span>
            </div>
          </div>

        </div>

                <!-- ПРАВАЯ ЧАСТЬ: питомец -->
        <div class="pet-box" id="pet-box" role="button" tabindex="0">
          <span class="pet-spacer" aria-hidden="true">·</span>
          <div class="pet-image-wrap">
            <img class="pet-image" id="pet-image" alt="" hidden>
            <span class="pet-placeholder" id="pet-placeholder">?</span>
          </div>
          <span class="pet-name" id="pet-name" data-ru="★ Питомец" data-en="★ Follower">★ Питомец</span>
        </div>
        
      </div>
    </section>

    <!-- ============ ЭКИПИРОВКА ============ -->
    <section class="panel">
      <h2 class="panel-title" data-ru="Экипировка" data-en="Equipment">Экипировка</h2>

      <div class="equipment-layout">

                <!-- Левый мнем -->
        <div class="slot slot-mnem is-locked" data-slot="mnem-1" data-lock="oracle">
          <div class="mnem-rows">
            <div class="mnem-row">
              <select class="mnem-select" data-mnem="1" data-row="1" disabled>
                <option value="" data-ru="— пусто —" data-en="— empty —">— пусто —</option>
                <option value="view" data-ru="Обзор 1–5%" data-en="View 1–5%">Обзор 1–5%</option>
                <option value="bonds" data-ru="Узы" data-en="Bonds">Узы</option>
              </select>
              <input type="number" class="mnem-input" data-mnem="1" data-row="1" min="1" max="5">
            </div>
            <div class="mnem-row">
              <select class="mnem-select" data-mnem="1" data-row="2" disabled>
                <option value="" data-ru="— пусто —" data-en="— empty —">— пусто —</option>
                <option value="view" data-ru="Обзор 1–5%" data-en="View 1–5%">Обзор 1–5%</option>
                <option value="bonds" data-ru="Узы" data-en="Bonds">Узы</option>
              </select>
              <input type="number" class="mnem-input" data-mnem="1" data-row="2" min="1" max="5">
            </div>
            <div class="mnem-row">
              <select class="mnem-select" data-mnem="1" data-row="3" disabled>
                <option value="" data-ru="— пусто —" data-en="— empty —">— пусто —</option>
                <option value="view" data-ru="Обзор 1–5%" data-en="View 1–5%">Обзор 1–5%</option>
                <option value="bonds" data-ru="Узы" data-en="Bonds">Узы</option>
              </select>
              <input type="number" class="mnem-input" data-mnem="1" data-row="3" min="1" max="5">
            </div>
          </div>
          <span class="slot-name">—</span>
          <span class="slot-stats"></span>
        </div>


        <!-- Голова -->
        <div class="slot slot-head" data-slot="head">
          <img class="slot-icon-img" alt="" hidden>
          <span class="slot-name" data-ru="Пусто" data-en="Empty">Пусто</span>
          <span class="slot-stats"></span>
        </div>

        <!-- Правый мнем -->
        <div class="slot slot-mnem" data-slot="mnem-2">
          <div class="mnem-rows">
            <div class="mnem-row">
              <select class="mnem-select" data-mnem="2" data-row="1">
                <option value="" data-ru="— пусто —" data-en="— empty —">— пусто —</option>
                <option value="view" data-ru="Обзор 1–5%" data-en="View 1–5%">Обзор 1–5%</option>
                <option value="bonds" data-ru="Узы" data-en="Bonds">Узы</option>
              </select>
              <input type="number" class="mnem-input" data-mnem="2" data-row="1" min="1" max="5">
            </div>
            <div class="mnem-row">
              <select class="mnem-select" data-mnem="2" data-row="2">
                <option value="" data-ru="— пусто —" data-en="— empty —">— пусто —</option>
                <option value="view" data-ru="Обзор 1–5%" data-en="View 1–5%">Обзор 1–5%</option>
                <option value="bonds" data-ru="Узы" data-en="Bonds">Узы</option>
              </select>
              <input type="number" class="mnem-input" data-mnem="2" data-row="2" min="1" max="5">
            </div>
            <div class="mnem-row">
              <select class="mnem-select" data-mnem="2" data-row="3">
                <option value="" data-ru="— пусто —" data-en="— empty —">— пусто —</option>
                <option value="view" data-ru="Обзор 1–5%" data-en="View 1–5%">Обзор 1–5%</option>
                <option value="bonds" data-ru="Узы" data-en="Bonds">Узы</option>
              </select>
              <input type="number" class="mnem-input" data-mnem="2" data-row="3" min="1" max="5">
            </div>
          </div>
          <span class="slot-name">—</span>
          <span class="slot-stats"></span>
        </div>

        
        <!-- Оружие 1 -->
        <div class="slot slot-weapon" data-slot="weapon-1">
          <img class="slot-icon-img" alt="" hidden>
          <span class="slot-name" data-ru="Пусто" data-en="Empty">Пусто</span>
          <span class="slot-stats"></span>
        </div>

        <!-- Торс -->
        <div class="slot slot-body" data-slot="body">
          <img class="slot-icon-img" alt="" hidden>
          <span class="slot-name" data-ru="Пусто" data-en="Empty">Пусто</span>
          <span class="slot-stats"></span>
        </div>

        <!-- Вторая рука (weapon / offhand) -->
        <div class="slot slot-weapon" data-slot="weapon-2">
          <div class="slot-mode-toggle" data-mode="weapon">
            <button type="button" class="mode-btn active" data-mode="weapon" title="Weapon / Оружие">⚔</button>
            <button type="button" class="mode-btn" data-mode="offhand" title="Offhand / Оффхенд">🛡</button>
          </div>
          <img class="slot-icon-img" alt="" hidden>
          <span class="slot-name" data-ru="Пусто" data-en="Empty">Пусто</span>
          <span class="slot-stats"></span>
        </div>

        <!-- Аксессуар 1 -->
        <div class="slot slot-accessory" data-slot="accessory-1">
          <img class="slot-icon-img" alt="" hidden>
          <span class="slot-name" data-ru="Пусто" data-en="Empty">Пусто</span>
          <span class="slot-stats"></span>
        </div>

        <!-- Ноги -->
        <div class="slot slot-legs" data-slot="legs">
          <img class="slot-icon-img" alt="" hidden>
          <span class="slot-name" data-ru="Пусто" data-en="Empty">Пусто</span>
          <span class="slot-stats"></span>
        </div>

        <!-- Аксессуар 2 -->
        <div class="slot slot-accessory" data-slot="accessory-2">
          <img class="slot-icon-img" alt="" hidden>
          <span class="slot-name" data-ru="Пусто" data-en="Empty">Пусто</span>
          <span class="slot-stats"></span>
        </div>

      </div>
    </section>

           <!-- ============ ПРОЧИЕ БОНУСЫ ============ -->
    <section class="panel">
      <h2 class="panel-title" data-ru="Прочие бонусы" data-en="Other Bonuses">Прочие бонусы</h2>

      <!-- Шаги -->
      <div class="steps-list">
        <label class="step-row">
          <input type="checkbox" class="step-check">
          <span data-ru="3000 шагов +10%" data-en="3000 steps +10%">3000 шагов +10%</span>
        </label>
        <label class="step-row">
          <input type="checkbox" class="step-check">
          <span data-ru="6000 шагов +10%" data-en="6000 steps +10%">6000 шагов +10%</span>
        </label>
      </div>

      <!-- Расходники 3×3 -->
      <div class="consumables-grid">
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 1" data-en="Consumable 1">Расходник 1</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 2" data-en="Consumable 2">Расходник 2</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 3" data-en="Consumable 3">Расходник 3</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 4" data-en="Consumable 4">Расходник 4</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 5" data-en="Consumable 5">Расходник 5</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 6" data-en="Consumable 6">Расходник 6</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 7" data-en="Consumable 7">Расходник 7</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 8" data-en="Consumable 8">Расходник 8</span>
        </label>
        <label class="consumable-item">
          <input type="checkbox">
          <span data-ru="Расходник 9" data-en="Consumable 9">Расходник 9</span>
        </label>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <p data-ru="Сделано для игроков Orna • Не связан с Northern Forge" 
       data-en="Made for Orna players • Not affiliated with Northern Forge">
      Сделано для игроков Orna • Не связан с Northern Forge
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
